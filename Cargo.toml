[package]
name = "trait_editor_plugin"
license = "MPL-2.0"
version = "0.1.1"
edition = "2021"
publish = false
description = "The trait asset editor (pulsar.trait_editor): an editor tool, this crate its root"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The plugin as a library of its own, loaded by the editor from plugins/editor:
# cargo build -p <this package> --release --features dll
dll = ["plugin_editor_api/editor", "plugin_editor_api/shared-dylibs"]
# The editor links it statically (the installed set); a DLL build leaves it out.
builtin = []

[dependencies]
gpui-ce.workspace = true
ui.workspace = true
plugin_editor_api = { workspace = true, features = ["editor"] }
engine_fs.workspace = true
ui_types_common.workspace = true
plugin_manager = { workspace = true }
# The plugin's descriptor and its registration's origin.
pulsar_plugins = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true

[lints]
workspace = true
